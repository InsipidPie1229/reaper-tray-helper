name: Build and test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and package
        shell: cmd
        run: build.cmd
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reaper-tray-helper-v1.1.0-rc.2
          path: |
            artifacts/ReaperTrayHelper-1.1.0-rc.2.zip
            artifacts/ReaperTrayHelper-1.1.0-rc.2-Source.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
